<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حجز كشف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f5f3; --card: #ffffff; --ink: #16323b; --muted: #5d747b;
    --line: #d6e0dd; --accent: #1f6f78; --accent-ink: #ffffff; --warn: #b4472f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Cairo", Tahoma, Arial, sans-serif; line-height: 1.7; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 18px 120px; }
  h1 { font-size: 1.7rem; font-weight: 800; margin: 0; line-height: 1.3; }
  .sub { color: var(--muted); margin: 2px 0 26px; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 26px 0 10px; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .day, .time { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
  .day { flex: 0 0 auto; min-width: 92px; padding: 10px 12px; text-align: center; scroll-snap-align: start; }
  .day b { display: block; font-size: 1.05rem; }
  .day small { color: var(--muted); }
  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .time { padding: 12px 6px; font-weight: 600; font-size: 1.02rem; }
  .day[aria-pressed="true"], .time[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--accent-ink); }
  .day[aria-pressed="true"] small { color: #b9ccd0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  label span { font-weight: 400; color: var(--muted); font-size: .92rem; }
  input { font: inherit; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; }
  input[inputmode="numeric"] { direction: ltr; text-align: right; }
  .hp { position: absolute; left: -9999px; height: 0; width: 0; opacity: 0; }
  .bar { position: fixed; inset: auto 0 0 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .bar div { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .bar p { margin: 0; flex: 1; font-size: .95rem; color: var(--muted); }
  .go { font: inherit; font-weight: 800; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 13px 26px; cursor: pointer; }
  .go:disabled { opacity: .45; cursor: not-allowed; }
  .msg { padding: 12px 14px; border-radius: 10px; background: #fbeae6; color: var(--warn); font-weight: 600; margin-top: 14px; }
  .empty { background: var(--card); border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }
  .done { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 22px; }
  .done h2 { margin-top: 0; font-size: 1.3rem; }
  .ref { direction: ltr; display: inline-block; font-weight: 800; letter-spacing: .04em; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: no-preference) { .done { animation: pop .25s ease-out; } @keyframes pop { from { transform: translateY(6px); opacity: 0; } } }
</style>
</head>
<body>
<main>
  <h1 id="docName"></h1>
  <p class="sub" id="docSub"></p>

  <div id="pick">
    <h2>اختار اليوم</h2>
    <div class="days" id="days" role="group" aria-label="الأيام المتاحة"></div>
    <h2 id="timeTitle" class="hidden">اختار الميعاد</h2>
    <div class="times" id="times" role="group" aria-label="المواعيد المتاحة"></div>
    <div id="formWrap" class="hidden">
      <h2>بياناتك</h2>
      <form id="form" novalidate>
        <label>الاسم بالكامل <input id="name" autocomplete="name" maxlength="60" required></label>
        <label>رقم الموبايل <span>هنكلمك على واتساب لتأكيد الحجز</span>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX" maxlength="11" required></label>
        <label>سبب الزيارة <span>جملة قصيرة (اختياري)</span> <input id="reason" maxlength="120"></label>
        <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      </form>
    </div>
    <div class="msg hidden" id="err" role="alert"></div>
  </div>

  <div class="done hidden" id="done" role="status">
    <h2>وصل طلب الحجز</h2>
    <p id="doneText"></p>
    <p>رقم الطلب: <span class="ref" id="ref"></span></p>
    <p>العيادة هتأكد معاك على واتساب. الميعاد مش مؤكد قبل ما توصلك رسالة التأكيد.</p>
  </div>
</main>

<div class="bar" id="bar">
  <div>
    <p id="summary">اختار اليوم والميعاد</p>
    <button class="go" id="go" disabled>احجز</button>
  </div>
</div>

<script>
/* ===== Per-doctor settings: edit these 4 lines only ===== */
const CONFIG = {
  scriptUrl: "https://script.google.com/macros/s/AKfycbxqERBI6IPe41k78f5xNGGfH2AdVqDn_n0rrXQCoiiKfmeZ5-O3MyB77Gzq_kdifW6bqA/exec",
  doctorName: "د. اسم الدكتور",
  specialty: "التخصص",
  clinic: "اسم العيادة"
};
/* ======================================================== */

const $ = id => document.getElementById(id);
const dayFmt = new Intl.DateTimeFormat("ar-EG-u-nu-latn", { weekday: "long" });
const dateFmt = new Intl.DateTimeFormat("ar-EG-u-nu-latn", { day: "numeric", month: "long" });
const ERR = {
  taken: "الميعاد ده اتحجز من شوية. اختار ميعاد تاني.",
  bad_name: "اكتب الاسم بالكامل (3 حروف على الأقل).",
  bad_phone: "رقم الموبايل لازم يبدأ بـ 01 ويكون 11 رقم.",
  too_many: "عندك طلبين لسه مستنيين تأكيد. استنى رد العيادة الأول.",
  net: "مفيش اتصال بالإنترنت أو الخدمة مش شغالة دلوقتي. جرب تاني بعد شوية."
};
let slots = {}, selDate = null, selTime = null, busy = false;

$("docName").textContent = CONFIG.doctorName;
$("docSub").textContent = CONFIG.specialty + " - " + CONFIG.clinic;
document.title = "حجز كشف - " + CONFIG.doctorName;

function parse(d) { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd); }
function fmtTime(t) {
  const [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "م" : "ص", h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ":" + String(m).padStart(2, "0") + " " + ap;
}
function showErr(k) { const e = $("err"); e.textContent = ERR[k] || ERR.net; e.classList.remove("hidden"); }
function clearErr() { $("err").classList.add("hidden"); }

function renderDays() {
  const box = $("days"); box.textContent = "";
  const dates = Object.keys(slots).sort();
  if (!dates.length) {
    box.className = ""; box.innerHTML = '<div class="empty">مفيش مواعيد متاحة دلوقتي. جرب تاني بعد شوية أو اتصل بالعيادة.</div>';
    return;
  }
  box.className = "days";
  dates.forEach(d => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "day"; b.setAttribute("aria-pressed", d === selDate);
    const dt = parse(d);
    b.innerHTML = "<b></b><small></small>";
    b.firstChild.textContent = dayFmt.format(dt);
    b.lastChild.textContent = dateFmt.format(dt);
    b.onclick = () => { selDate = d; selTime = null; renderDays(); renderTimes(); sync(); };
    box.appendChild(b);
  });
}
function renderTimes() {
  const box = $("times"); box.textContent = "";
  $("timeTitle").classList.toggle("hidden", !selDate);
  if (!selDate) return;
  slots[selDate].forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "time"; b.textContent = fmtTime(t);
    b.setAttribute("aria-pressed", t === selTime);
    b.onclick = () => { selTime = t; renderTimes(); sync(); $("formWrap").classList.remove("hidden"); };
    box.appendChild(b);
  });
}
function sync() {
  const ok = selDate && selTime;
  $("go").disabled = !ok || busy;
  $("summary").textContent = ok ? dayFmt.format(parse(selDate)) + " " + dateFmt.format(parse(selDate)) + " - " + fmtTime(selTime) : "اختار اليوم والميعاد";
}

async function load() {
  try {
    const r = await fetch(CONFIG.scriptUrl + "?action=slots");
    const j = await r.json();
    slots = {};
    (j.slots || []).forEach(s => { (slots[s.date] = slots[s.date] || []).push(s.time); });
  } catch (e) { slots = {}; showErr("net"); }
  if (selDate && !slots[selDate]) { selDate = null; selTime = null; }
  renderDays(); renderTimes(); sync();
}

$("go").onclick = async () => {
  clearErr();
  const name = $("name").value.trim(), phone = $("phone").value.replace(/\s+/g, "");
  if (name.length < 3) return showErr("bad_name");
  if (!/^01[0125][0-9]{8}$/.test(phone)) return showErr("bad_phone");
  busy = true; $("go").disabled = true; $("go").textContent = "جاري الحجز...";
  try {
    const r = await fetch(CONFIG.scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },   // plain text avoids a CORS preflight on Apps Script
      body: JSON.stringify({ action: "book", date: selDate, time: selTime, name, phone, reason: $("reason").value.trim(), website: $("website").value })
    });
    const j = await r.json();
    if (j.ok) {
      $("pick").classList.add("hidden"); $("bar").classList.add("hidden");
      $("doneText").textContent = dayFmt.format(parse(selDate)) + " " + dateFmt.format(parse(selDate)) + " الساعة " + fmtTime(selTime);
      $("ref").textContent = j.id; $("done").classList.remove("hidden");
      window.scrollTo(0, 0);
      return;
    }
    showErr(j.error);
    if (j.error === "taken") { selTime = null; await load(); }
  } catch (e) { showErr("net"); }
  busy = false; $("go").textContent = "احجز"; sync();
};

load();
</script>
</body>
</html>
